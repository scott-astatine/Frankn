[package]
name = "frankn-signaling-server"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.42"
futures-util = "0.3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
sha2 = "0.10.9"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8.5"
base64 = "0.22.1"
hex = "0.4.3"
