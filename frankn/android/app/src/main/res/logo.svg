<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ================================================================
       Frankn — Neon Frankenstein Circuit Icon
       Colours: Cyan #00F3FF | Green #00FF41 | Magenta #FF00FF | Void #050505
       ================================================================ -->
  <defs>
    <!-- Two-pass glow: tight for crisp edge, wide for neon bloom -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="cyan-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00F3FF" />
      <stop offset="100%" stop-color="#00FF41" />
    </linearGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="512" height="512" rx="72" fill="#050505" />

  <!-- ── MAIN ICON GROUP (centred at 256,256) ── -->
  <g filter="url(#glow)">

    <!-- ═══════════════════════════════════════════
         FRANKENSTEIN HEAD SILHOUETTE
         Blocky flat-top, tapered jaw, classic shape
         ═══════════════════════════════════════════ -->
    <!-- Outline -->
    <path d="M160 100
             H352
             L370 140 V260
             Q370 320 320 340
             L290 350 V370 H270 V350
             Q256 360 242 350 V370 H222 V350
             L192 340
             Q142 320 142 260
             V140 Z"
          fill="none"
          stroke="url(#cyan-green)"
          stroke-width="10"
          stroke-linejoin="round" />

    <!-- Subtle inner shadow edge for depth -->
    <path d="M160 100
             H352
             L370 140 V260
             Q370 320 320 340
             L290 350 V370 H270 V350
             Q256 360 242 350 V370 H222 V350
             L192 340
             Q142 320 142 260
             V140 Z"
          fill="none"
          stroke="#00F3FF"
          stroke-width="3"
          stroke-linejoin="round"
          opacity="0.3" />

    <!-- ═══════════════════════════════════════════
         CIRCUIT TRACES on forehead
         ═══════════════════════════════════════════ -->
    <g stroke="#00F3FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Horizontal main bus -->
      <path d="M190 155 H322" />
      <!-- Traces branching down from bus -->
      <path d="M210 155 V180" />
      <path d="M256 155 V180" />
      <path d="M302 155 V180" />
      <!-- Cross links -->
      <path d="M210 180 H256" />
      <path d="M256 180 H302" />
      <!-- Traces to jaw area -->
      <path d="M190 155 V140 H170" />
      <path d="M322 155 V140 H342" />
    </g>

    <!-- Circuit NODES (small filled circles at junctions) -->
    <g fill="#00FF41">
      <circle cx="210" cy="180" r="4" />
      <circle cx="256" cy="180" r="4" />
      <circle cx="302" cy="180" r="4" />
      <circle cx="190" cy="155" r="3" />
      <circle cx="322" cy="155" r="3" />
      <circle cx="170" cy="140" r="3" />
      <circle cx="342" cy="140" r="3" />
    </g>

    <!-- ═══════════════════════════════════════════
         THE "F" — embedded in forehead circuit
         Bright green, the brand initial
         ═══════════════════════════════════════════ -->
    <path d="M246 122 H276 M246 122 V178 M246 150 H268"
          stroke="#00FF41"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none" />

    <!-- ═══════════════════════════════════════════
         POWER-BUTTON EYE — right eye, magenta
         ═══════════════════════════════════════════ -->
    <g>
      <!-- Outer circle -->
      <circle cx="212" cy="225" r="22"
              stroke="#FF00FF" stroke-width="5" fill="none" />
      <!-- Power-bar -->
      <line x1="212" y1="207" x2="212" y2="218"
            stroke="#FF00FF" stroke-width="5" stroke-linecap="round" />
      <!-- Inner glow dot -->
      <circle cx="212" cy="225" r="4" fill="#FF00FF" opacity="0.5" />
    </g>

    <!-- ═══════════════════════════════════════════
         SOCKET EYE — left eye (dark socket, green
         inner glow) gives Frankenstein asymmetry
         ═══════════════════════════════════════════ -->
    <circle cx="300" cy="225" r="20"
            fill="#050505"
            stroke="url(#cyan-green)"
            stroke-width="4" />
    <circle cx="300" cy="225" r="6" fill="#00FF41" opacity="0.7" />

    <!-- ═══════════════════════════════════════════
         JAW — teeth bars (data bars)
         ═══════════════════════════════════════════ -->
    <g fill="#00F3FF">
      <rect x="200" y="300" width="18" height="28" rx="2" />
      <rect x="230" y="300" width="18" height="28" rx="2" opacity="0.7" />
      <rect x="260" y="300" width="18" height="28" rx="2" opacity="0.5" />
      <rect x="290" y="300" width="18" height="28" rx="2" opacity="0.3" />
    </g>

    <!-- ═══════════════════════════════════════════
         NECK BOLTS — hexagonal, cyberpunk hardware
         ═══════════════════════════════════════════ -->
    <!-- Left bolt -->
    <polygon points="118,240 106,260 118,280 142,280 154,260 142,240"
             fill="none"
             stroke="url(#cyan-green)"
             stroke-width="4"
             stroke-linejoin="round" />
    <polygon points="124,250 118,260 124,270 136,270 142,260 136,250"
             fill="#00F3FF"
             opacity="0.3" />
    <!-- Bolt centre dot -->
    <circle cx="130" cy="260" r="3" fill="#00F3FF" />

    <!-- Right bolt -->
    <polygon points="372,240 360,260 372,280 396,280 408,260 396,240"
             fill="none"
             stroke="url(#cyan-green)"
             stroke-width="4"
             stroke-linejoin="round" />
    <polygon points="378,250 372,260 378,270 390,270 396,260 390,250"
             fill="#00F3FF"
             opacity="0.3" />
    <circle cx="384" cy="260" r="3" fill="#00F3FF" />

    <!-- ═══════════════════════════════════════════
         DATA STITCHING — green solder marks
         across the forehead (classic Frankenstein
         scar reimagined as circuit solder points)
         ═══════════════════════════════════════════ -->
    <g stroke="#00FF41" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <path d="M280 108 L290 120 M286 104 L296 116 M274 112 L284 124" />
      <!-- Solder dots -->
      <circle cx="290" cy="120" r="2" fill="#00FF41" />
      <circle cx="296" cy="116" r="2" fill="#00FF41" />
      <circle cx="284" cy="124" r="2" fill="#00FF41" />
    </g>

  </g><!-- /glow -->

  <!-- ── Decorative corner accents (subtle, no glow) ── -->
  <g stroke="#1A1A2E" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Top-left -->
    <path d="M32 60 V32 H60" />
    <!-- Top-right -->
    <path d="M480 60 V32 H452" />
    <!-- Bottom-left -->
    <path d="M32 452 V480 H60" />
    <!-- Bottom-right -->
    <path d="M480 452 V480 H452" />
  </g>

</svg>
